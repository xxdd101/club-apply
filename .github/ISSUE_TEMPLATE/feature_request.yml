name: 功能建议
description: 提出一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明你的**使用场景**，这比"我想要一个 XX 按钮"有用得多。

  - type: textarea
    id: scenario
    attributes:
      label: 你的使用场景
      description: 你在用它做什么？遇到的不便是什么？
      placeholder: |
        我们用这个系统做活动报名，评委有 20 人，需要在列表里按「评委打分」排序……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作
      description: 描述期望的行为，不用管怎么实现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 现在的版本你是怎么绕过这个问题的？

  - type: dropdown
    id: scope
    attributes:
      label: 你愿意自己实现吗
      options:
        - 我可以提 PR
        - 我可以帮忙测试
        - 只能提建议
