# =============================================================================
# Nginx 反向代理配置示例 —— 示例动漫社 · 入社申请审核系统
#
# 用途：把 80/443 端口的域名访问转发到本机 3000 端口的 Node 服务
# 安装：把本文件放到 /etc/nginx/conf.d/club.conf（或 sites-available 并做软链）
#       修改下面的 server_name 为你的域名（没有域名就填服务器公网 IP）
#       然后执行： nginx -t && systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;        # ← 改成你的域名，或用 IP 访问时填公网 IP

    # ⚠ 必改项：表单含图片/音频上传（图片≤10MB、音频≤30MB），
    #            Nginx 默认只有 1MB，不放开会导致上传报 413 错误
    client_max_body_size 40m;

    # 大文件上传/下载时避免代理超时
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 访问日志（可选）
    access_log /var/log/nginx/club.access.log;
    error_log  /var/log/nginx/club.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 音频在线播放需要支持 Range 断点请求
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }

    # 上传目录静态直出（可选优化，减少 Node 压力）
    # location /uploads/ {
    #     alias /opt/club-apply/data/uploads/;
    #     expires 7d;
    # }
}

# =============================================================================
# 申请 HTTPS 证书（免费，自动续期）：
#     apt-get install -y certbot python3-certbot-nginx
#     certbot --nginx -d your-domain.com
# certbot 会自动改写本文件、加上 443 监听并把 80 跳转到 443。
#
# ⚠ 备案提醒：
#   · 阿里云/腾讯云【中国大陆】服务器，用域名走 80/443 必须完成 ICP 备案；
#     直接用 IP:3000 访问一般不需要备案，但不安全也不方便。
#   · 香港/海外服务器无需备案，可直接绑域名 + HTTPS。
# =============================================================================
